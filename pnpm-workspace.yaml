packages:
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  sharp: true

ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@rollup/rollup-android-arm-eabi@4.62.3'
  - '@rollup/rollup-android-arm64@4.62.3'
  - '@rollup/rollup-darwin-arm64@4.62.3'
  - '@rollup/rollup-darwin-x64@4.62.3'
  - '@rollup/rollup-freebsd-arm64@4.62.3'
  - '@rollup/rollup-freebsd-x64@4.62.3'
  - '@rollup/rollup-linux-arm-gnueabihf@4.62.3'
  - '@rollup/rollup-linux-arm-musleabihf@4.62.3'
  - '@rollup/rollup-linux-arm64-gnu@4.62.3'
  - '@rollup/rollup-linux-arm64-musl@4.62.3'
  - '@rollup/rollup-linux-loong64-gnu@4.62.3'
  - '@rollup/rollup-linux-loong64-musl@4.62.3'
  - '@rollup/rollup-linux-ppc64-gnu@4.62.3'
  - '@rollup/rollup-linux-ppc64-musl@4.62.3'
  - '@rollup/rollup-linux-riscv64-gnu@4.62.3'
  - '@rollup/rollup-linux-riscv64-musl@4.62.3'
  - '@rollup/rollup-linux-s390x-gnu@4.62.3'
  - '@rollup/rollup-linux-x64-gnu@4.62.3'
  - '@rollup/rollup-linux-x64-musl@4.62.3'
  - '@rollup/rollup-openbsd-x64@4.62.3'
  - '@rollup/rollup-openharmony-arm64@4.62.3'
  - '@rollup/rollup-win32-arm64-msvc@4.62.3'
  - '@rollup/rollup-win32-ia32-msvc@4.62.3'
  - '@rollup/rollup-win32-x64-gnu@4.62.3'
  - '@rollup/rollup-win32-x64-msvc@4.62.3'
  - '@turbo/darwin-64@2.10.7'
  - '@turbo/darwin-arm64@2.10.7'
  - '@turbo/linux-64@2.10.7'
  - '@turbo/linux-arm64@2.10.7'
  - '@turbo/windows-64@2.10.7'
  - '@turbo/windows-arm64@2.10.7'
  - rollup@4.62.3
  - turbo@2.10.7
peerDependencyRules:
  allowedVersions:
    '@nuxt/module-builder>typescript': '7'
    'devframe>cac': '6'
    'mkdist>vue-sfc-transformer': '0.2'
    'rollup-plugin-dts>typescript': '7'
    'tsconfck>typescript': '7'
    'unbuild>typescript': '7'
shamefullyHoist: true
